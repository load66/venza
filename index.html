<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#23262f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Venza Garage</title>
<style>
  html,body{margin:0;min-height:100%;background:#1c1e24;color:#eef0f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .boot-card{max-width:420px;width:100%}
  .boot-title{font-size:28px;font-weight:800;letter-spacing:2px;margin-bottom:8px}
  .boot-sub{font-size:13px;color:#9aa0b8;line-height:1.55}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22d46e;margin-right:8px;box-shadow:0 0 14px rgba(34,212,110,.55)}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-card"><div class="boot-title"><span class="dot"></span>VENZA GARAGE</div><div class="boot-sub" id="bootStatus">Loading the newest app build…</div></div></div>
<script>
(async function(){
  const stamp = Date.now();
  const status = document.getElementById('bootStatus');
  try{
    let remote = {version:'latest',build:String(stamp),updated:''};
    try{
      const vr = await fetch('./version.json?cache=' + stamp, {cache:'no-store'});
      if(vr.ok) remote = Object.assign(remote, await vr.json());
    }catch(e){}
    status.textContent = 'Loading APP v' + remote.version + '…';
    const shellUrl = './venza.html?cache=' + stamp + '&build=' + encodeURIComponent(remote.build || stamp);
    const res = await fetch(shellUrl, {cache:'no-store'});
    if(!res.ok) throw new Error('Unable to load venza.html');
    let html = await res.text();
    const assetTag = encodeURIComponent(remote.build || remote.version || stamp);
    html = html
      .replace(/\.\/css\/style\.css\?v=[^"']+/g, './css/style.css?v=' + assetTag)
      .replace(/\.\/js\/app\.js\?v=[^"']+/g, './js/app.js?v=' + assetTag)
      .replace(/\.\/js\/update\.js\?v=[^"']+/g, './js/update.js?v=' + assetTag);
    if(remote.version){
      html = html.replace(/APP v[0-9.]+ · [A-Za-z]{3} \d{1,2}, \d{4}/g, 'APP v' + remote.version + (remote.updated ? ' · ' + remote.updated : ''));
      html = html.replace(/Current installed source: APP v[0-9.]+\./g, 'Current installed source: APP v' + remote.version + '.');
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    status.innerHTML = 'Could not load the app. <button onclick="location.reload()" style="margin-top:14px;padding:10px 16px;border-radius:10px;border:0;font-weight:700">Try again</button>';
  }
})();
</script>
</body>
</html>
